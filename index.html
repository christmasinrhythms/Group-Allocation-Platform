<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Allocation Platform</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="./style.css">
<script src="./jszip.min.js" defer></script>
<script src="./workbook.js" defer></script>
<script src="./app.js" defer></script>
</head>
<body>
<div class="page" id="desk">
  <header class="hero">
    <div><h1>Group Allocation Platform</h1></div>
    <div class="hero-actions">
      <div class="preferences">
        <div role="group" aria-label="語言" data-i18n-label="language">
          <button type="button" id="language-zh" aria-pressed="true">繁中</button>
          <button type="button" id="language-en" aria-pressed="false" aria-label="English">EN</button>
        </div>
        <div role="group" aria-label="顯示主題" data-i18n-label="theme">
          <button type="button" id="theme-light" aria-pressed="true" data-i18n="light">淺色</button>
          <button type="button" id="theme-dark" aria-pressed="false" data-i18n="dark">深色</button>
        </div>
      </div>
      <div class="excel" id="excel-controls" hidden>
        <span id="save-status" role="status"></span>
        <button id="save" type="button" data-i18n="saveBoard">儲存安排</button>
        <button id="export" type="button" data-i18n="exportExcel">匯出 Excel</button>
        <button id="exit-demo" type="button" data-i18n="exitDemo" hidden>離開示範</button>
      </div>
    </div>
  </header>
  <section id="connection" class="connection" aria-labelledby="connect-title">
    <h2 id="connect-title" data-i18n="connectTitle">匯入分組 Excel</h2>
    <p data-i18n="connectIntro">只需匯入一次。之後喺工作台改安排，會自動儲存在呢個瀏覽器。</p>
    <div class="connection-actions">
      <input id="workbook-file" type="file" accept=".xlsx" hidden>
      <button id="import" class="primary" type="button" data-i18n="importExcel">選擇 Excel 檔案</button>
      <button id="demo" type="button" data-i18n="demo">試用示範名單</button>
    </div>
    <p id="connection-status" role="status" hidden></p>
  </section>
  <main id="workbench" hidden>
    <div class="toolbar">
      <div class="views" role="group" aria-label="檢視" data-i18n-label="view">
        <button type="button" id="tables" aria-pressed="true" data-i18n="tables">餐桌</button>
        <button type="button" id="groups" aria-pressed="false" data-i18n="groups">遊戲組</button>
        <button type="button" id="roster" aria-pressed="false" data-i18n="roster">總名單</button>
      </div>
      <div class="tools">
        <input id="search" type="search" aria-label="搜尋姓名或部門" placeholder="搜尋姓名或部門" data-i18n-label="search" data-i18n-placeholder="search">
        <label class="filter"><input id="split-only" type="checkbox"><span data-i18n="splitFilter">只看與舊同桌分開</span></label>
        <button id="undo" type="button" data-i18n="undo" disabled>復原</button>
      </div>
    </div>
    <div class="summary">
      <h2 id="view-title">餐桌</h2><p id="counts"></p>
    </div>
    <p id="help" class="help">拖動姓名到另一張桌。點姓名可選目的地或交換座位。</p>
    <p id="storage-help" class="help sync-help">安排儲存在呢個瀏覽器。</p>
    <p id="history-summary" class="help" hidden></p>
    <p id="message" class="message" aria-live="polite" hidden></p>
    <div id="issues" class="issues" hidden></div>
    <section id="board" aria-label="分組結果" data-i18n-label="assignments" aria-busy="true"><p data-i18n="loadingRoster">正在載入名單…</p></section>
  </main>
</div>
<button id="unassigned-toggle" class="unassigned-toggle" type="button" aria-controls="unassigned-drawer" aria-expanded="false" hidden>
  <span data-i18n="unassignedList">未分配名單</span><span id="unassigned-count" class="unassigned-count"></span>
</button>
<aside id="unassigned-drawer" class="unassigned-drawer" aria-labelledby="unassigned-title" hidden>
  <header>
    <div><h2 id="unassigned-title" data-i18n="unassignedList">未分配名單</h2><p id="unassigned-context"></p></div>
    <button id="unassigned-close" type="button" aria-label="收起未分配名單" data-i18n-label="closeDrawer">×</button>
  </header>
  <p class="drawer-help" data-i18n="drawerHelp">拖動姓名分配。拖返呢個面板可移回名單。</p>
  <ul id="unassigned-people"></ul>
  <p id="unassigned-empty" class="drawer-help" hidden></p>
</aside>
<nav id="drop-destinations" aria-label="拖放目的地" data-i18n-label="dropTargets" hidden></nav>
<dialog id="move-dialog">
  <form id="move-form">
    <header><h2 id="person-name" tabindex="-1"></h2><button type="button" id="cancel" aria-label="關閉" data-i18n-label="close">×</button></header>
    <dl id="person-detail" class="person-details"></dl>
    <section class="history" aria-labelledby="history-title">
      <h3 id="history-title" data-i18n="formerTablemates">去年同桌</h3>
      <p id="history-note" class="help"></p>
      <ul id="former-tablemates"></ul>
    </section>
    <label><span data-i18n="assignmentField">調整項目</span><select id="field"><option value="table" data-i18n="tableField">餐桌</option><option value="group" data-i18n="groupField">遊戲組</option></select></label>
    <label><span data-i18n="moveTo">移至</span><select id="destination"></select></label>
    <label id="swap-label"><span data-i18n="swapWith">交換對象（選填）</span><select id="swap"></select></label>
    <p id="move-note" class="help"></p>
    <button type="submit" class="primary" data-i18n="saveMove">儲存更改</button>
  </form>
</dialog>
</body>
</html>
